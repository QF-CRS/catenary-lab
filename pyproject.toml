[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catenary-lab"
version = "0.1.1"
description = "A small, dependency-free catenary and sag-tension toolkit for overhead lines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Catenary Lab contributors" }
]
keywords = ["catenary", "sag", "tension", "overhead-line", "engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/QF-CRS/catenary-lab"
Repository = "https://github.com/QF-CRS/catenary-lab"
Issues = "https://github.com/QF-CRS/catenary-lab/issues"

[project.scripts]
catenary-lab = "catenarylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catenarylab = ["py.typed"]
